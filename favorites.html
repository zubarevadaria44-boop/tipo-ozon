<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ozon.css">
    <title>online-store</title>
</head>
<body>
    <header class="site-header">
        <h1>DANA</h1>
        <nav class="navigation">
            <div class="Navigation"><a href="ozon.html">Главная</a></div>
            <div class="Navigation"><a href="favorites.html">Избранное</a></div>
            <div class="Navigation"><a href="cart.html">Корзина</a></div>
        </nav>
    </header>

    <main class="catalog" id="favorites-list"></main>
   
    <script src="products.js"></script>
     <script src="cart.js"></script>
    <script>
        const favoriteId = getList('favorites');
        const favoriteProducts = products.filter(p => favoriteId.includes(p.id));

        const container = document.getElementById('favorites-list');

        if (favoriteProducts.length === 0) {
            container.innerHTML = "<p>В избранном нет продуктов</p>";
        } else {
            favoriteProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                <a href="product.html?id=${product.id}">
                    <img src="${product.images[0]}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p class="price">${product.variants[0].price} руб.</p>
                    <button onclick="removeFromFavorites(${product.id})">Удалить из избранного</button>
                </a>
                `;
                container.appendChild(card);
            });
        }
    </script>
