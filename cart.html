<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ozon.css">
    <title>online-store</title>
</head>
<body>
    <header class="site-header">
        <h1>DANA</h1>
        <nav class="navigation">
            <div class="Navigation"><a href="ozon.html">Главная</a></div>
            <div class="Navigation"><a href="favorites.html">Избранное</a></div>
            <div class="Navigation"><a href="cart.html">Корзина</a></div>
        </nav>
    </header>
       <main class="catalog" id="cart-list"></main>

    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script>
        const cartItems = getList('cart');
        const cartProducts = cartItems.map(item=>{
            const product = products.find(p => p.id === item.id);
            return {
                ...product,
                selectedWeight: item.weight,
                selectedPrice: item.price
            };
        });

        const container = document.getElementById('cart-list');

        if (cartProducts.length === 0) {
            container.innerHTML = "<p>В корзине нет продуктов</p>";
        } else {
            cartProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                <a href="product.html?id=${product.id}">
                    <img src="${product.images[0]}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p class="price">${product.selectedPrice} руб.</p>
                    <p class="quantity">Количество: 1</p>
                </a>
                <button onclick="removeFromCart(${product.id})">Удалить из корзины</button>
                `;
                container.appendChild(card);
            });
            const total = cartProducts.reduce((sum, product) => sum + product.selectedPrice, 0);
            const totalBlock= document.createElement('div');
            totalBlock.innerHTML = `<h2>Итого: ${total} руб.</h2>`;
         
        totalBlock.className = 'cart-total';
        totalBlock.innerHTML = `
        <h2>Итого: ${total} руб.</h2>
        <button class="checkout-btn" onclick="window.location.href='order.html'">Оформить заказ</button>
        `;
        container.appendChild(totalBlock);
        }
    </script>
